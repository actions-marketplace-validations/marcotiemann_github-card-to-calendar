name: Rebuild dist for Dependabot

# Dependencies are bundled into dist/index.js, so a Dependabot bump leaves the committed
# bundle stale and fails the "dist is up to date" check in CI. This rebuilds the bundle on
# Dependabot's branch and re-runs CI on the new commit (a push made with GITHUB_TOKEN does
# not trigger workflows by itself).
#
# pull_request_target gives this job a write token, so it only runs for PRs opened by
# Dependabot and installs without running dependency lifecycle scripts.
on:
  pull_request_target:
    branches: [main]
    paths: [package.json, package-lock.json]

permissions:
  contents: write
  actions: write

jobs:
  rebuild:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Commit rebuilt dist and re-run CI
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- dist/index.js; then
            echo "dist is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.js
          git commit -m "Rebuild dist"
          git push origin "HEAD:$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
