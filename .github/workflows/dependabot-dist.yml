name: Rebuild dist for Dependabot

# Dependencies are bundled into dist/index.js, so a Dependabot bump leaves the committed
# bundle stale and fails the "dist is up to date" check in CI. This rebuilds the bundle on
# Dependabot's branch after type checking and testing it.
#
# A push made with GITHUB_TOKEN does not trigger CI, so the result is reported as a commit
# status on the new head commit, which GitHub shows on the pull request.
#
# pull_request_target gives this job a write token, so it only runs for PRs opened by
# Dependabot and installs without running dependency lifecycle scripts.
on:
  pull_request_target:
    branches: [main]
    paths: [package.json, package-lock.json]

permissions:
  contents: write
  statuses: write

jobs:
  rebuild:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Commit rebuilt dist
        id: commit
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! git diff --quiet -- dist/index.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/index.js
            git commit -m "Rebuild dist"
            git push origin "HEAD:$BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report result on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha || github.event.pull_request.head.sha }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          [ "$RESULT" = "success" ] && state=success
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context="Dependabot: tests and dist" \
            -f description="Type check, tests and dist rebuild: $state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
